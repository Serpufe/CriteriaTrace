name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prepare isolated runtime for adversarial tests
        if: matrix.os == 'ubuntu-latest'
        run: docker pull node:24-alpine

      - name: Test
        run: npm test

      - name: Build CLI and Action bundle
        run: npm run build

      - name: Check committed Action bundle
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- action/dist/

      - name: CLI smoke checks
        run: |
          node dist/cli.js --help
          node dist/cli.js init
          node dist/cli.js doctor --format json

      - name: Offline demo
        run: node dist/cli.js demo --output-dir .criteriatrace-demo

      - name: Package dry run
        run: npm pack --dry-run

      - name: Upload actual demo report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criteriatrace-demo-${{ matrix.os }}
          path: .criteriatrace-demo/
          if-no-files-found: error
          include-hidden-files: true
