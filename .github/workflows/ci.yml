name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prepare isolated runtime for adversarial tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker pull node:24-alpine
          docker image inspect node:24-alpine --format '{{index .RepoDigests 0}}'

      - name: Test
        run: npm test
        env:
          CRITERIATRACE_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}

      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=low

      - name: Build CLI and Action bundle
        run: npm run build

      - name: Check committed Action bundle
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- action/dist/

      - name: CLI smoke checks
        run: |
          node dist/cli.js --help
          node dist/cli.js init --help
          node dist/cli.js doctor --format json

      - name: Offline demo
        run: node dist/cli.js demo --output-dir .criteriatrace-demo

      - name: Package dry run
        run: npm pack --dry-run

      - name: Upload actual demo report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criteriatrace-demo-${{ matrix.os }}
          path: .criteriatrace-demo/
          if-no-files-found: error
          include-hidden-files: true

  hostile-pr-action:
    name: Controlled hostile PR against trusted Action
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'codex/linux-sandbox-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR with both revisions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted Action from exact PR base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-action
          persist-credentials: false

      - name: Confirm exact PR revisions are present
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Prepare real Docker isolation and fictional host canaries
        run: |
          docker pull node:24-alpine
          docker image inspect node:24-alpine --format '{{index .RepoDigests 0}}'
          printf 'fictional host canary\n' > "$HOME/.criteriatrace-host-canary"
          printf 'fictional host canary\n' > /tmp/criteriatrace-host-canary

      - name: Execute trusted Action against controlled hostile PR
        id: trace
        uses: ./trusted-action
        env:
          CRITERIATRACE_FAKE_SECRET: LINUX_CANARY_SECRET

      - name: Assert Action's real report
        env:
          REPORT_PATH: ${{ steps.trace.outputs.json-report-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.REPORT_PATH, 'utf8'));
          assert.equal(report.base, process.env.BASE_SHA);
          assert.equal(report.head, process.env.HEAD_SHA);
          assert.deepEqual(report.executionPolicy, { mode: 'isolated', network: 'disabled' });
          assert.equal(report.summary.VERIFIED, 0);
          const head = report.executions.find(item => item.id === 'head-test');
          assert.equal(head?.termination, 'exit');
          assert.equal(head?.exitCode, 0);
          assert.match(head.output, /PASS VERIFIED all acceptance criteria/);
          console.log('PASS: exact revisions, isolated execution, hostile probes, and no forged VERIFIED');
          NODE
          test -z "$(docker ps -a --filter 'name=^/criteriatrace-' --format '{{.ID}}')"

      - name: Reject review event even with a PR-shaped payload
        run: |
          printf '{"pull_request":{"number":1}}\n' > "$RUNNER_TEMP/criteriatrace-review-event.json"
          if env GITHUB_EVENT_NAME=pull_request_review GITHUB_EVENT_PATH="$RUNNER_TEMP/criteriatrace-review-event.json" node trusted-action/action/dist/index.js > "$RUNNER_TEMP/criteriatrace-review-event.log" 2>&1; then
            echo 'FAIL: pull_request_review was accepted'
            exit 1
          fi
          grep -F 'requires a pull_request event' "$RUNNER_TEMP/criteriatrace-review-event.log"

      - name: Upload Action evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criteriatrace-hostile-pr-action
          path: ${{ runner.temp }}/criteriatrace/
          if-no-files-found: warn

  stopped-daemon:
    name: Fail closed with stopped Docker daemon
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'codex/linux-sandbox-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled PR with both revisions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Build CLI before stopping Docker
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Stop daemon and prove no host fallback
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CRITERIATRACE_FAKE_SECRET: LINUX_CANARY_SECRET
        run: |
          trap 'sudo systemctl start docker.socket docker.service || true' EXIT
          sudo systemctl stop docker.service docker.socket
          if docker info >/dev/null 2>&1; then
            echo 'FAIL: Docker daemon remained available'
            exit 1
          fi
          if node dist/cli.js verify --text 'AC-STOP: Docker outage does not permit host execution' --base "$BASE_SHA" --head "$HEAD_SHA" --format json --output "$RUNNER_TEMP/criteriatrace-daemon-stop.json"; then
            verify_status=0
          else
            verify_status=$?
          fi
          test "$verify_status" -eq 3
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/criteriatrace-daemon-stop.json`, 'utf8'));
          assert.equal(report.base, process.env.BASE_SHA);
          assert.equal(report.head, process.env.HEAD_SHA);
          assert.deepEqual(report.executionPolicy, { mode: 'isolated', network: 'disabled' });
          assert.equal(report.executions.find(item => item.id === 'head-test')?.termination, 'unavailable');
          assert.ok(report.executions.every(item => item.workspace === 'No repository command ran.'));
          console.log('PASS: Docker daemon stopped; no repository command ran on host');
          NODE

      - name: Lose Docker daemon during a running command
        run: |
          sudo systemctl start docker.socket docker.service
          docker pull node:24-alpine
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { chmod, mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { executeCommand, startIsolatedSession, stopIsolatedSession } from './dist/runtime.js';
          const workspace = await mkdtemp(join(tmpdir(), 'criteriatrace-daemon-loss-'));
          const marker = join(workspace, 'host-executed');
          const policy = { mode: 'isolated', allowNetwork: false, image: 'node:24-alpine' };
          let name;
          try {
            await chmod(workspace, 0o755);
            name = await startIsolatedSession(workspace, policy);
            assert.ok(name, 'Docker session must start before the daemon loss');
            const script = `const fs=require('fs');try{fs.writeFileSync(${JSON.stringify(marker)},'BAD')}catch{};console.log('DAEMON_LOSS_STARTED');setInterval(()=>{},1000)`;
            const pending = executeCommand({
              id: 'daemon-loss', revision: 'fixture', command: ['node', '-e', script],
              workspace, timeoutMs: 4000, outputBytes: 1024,
              policy: { ...policy, containerName: name },
            });
            let running = false;
            for (let i = 0; i < 40; i++) {
              const processes = execFileSync('docker', ['top', name], { encoding: 'utf8' });
              if (processes.includes('DAEMON_LOSS_STARTED')) { running = true; break; }
              await new Promise(resolve => setTimeout(resolve, 100));
            }
            assert.ok(running, 'Host stopped Docker only after the repository command started');
            execFileSync('sudo', ['systemctl', 'stop', 'docker.service', 'docker.socket']);
            const result = await pending;
            await assert.rejects(readFile(marker), { code: 'ENOENT' });
            await writeFile(join(process.env.RUNNER_TEMP, 'criteriatrace-daemon-loss.json'), JSON.stringify({
              termination: result.termination, output: result.output, workspace: result.workspace,
              hostMarkerExists: false,
            }));
            assert.ok(result.output.includes('DAEMON_LOSS_STARTED'));
            assert.equal(result.termination, 'unavailable');
            console.log('PASS: daemon lost during command; no host fallback');
          } finally {
            execFileSync('sudo', ['systemctl', 'start', 'docker.socket', 'docker.service']);
            if (name) stopIsolatedSession(name);
            await rm(workspace, { recursive: true, force: true });
          }
          NODE

      - name: Upload stopped-daemon evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criteriatrace-stopped-daemon
          path: |
            ${{ runner.temp }}/criteriatrace-daemon-stop.json
            ${{ runner.temp }}/criteriatrace-daemon-loss.json
          if-no-files-found: warn
