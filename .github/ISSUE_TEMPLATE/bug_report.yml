name: Bug report
description: Report incorrect criteria, evidence, execution, or report behavior.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Avoid pasting private source, API keys, or sensitive report output.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the command and the relevant sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CriteriaTrace version and Node version
      placeholder: '0.1.0, Node 24'
    validations:
      required: true
